name: Bug report
description: Report a reproducible CanvasProbe defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include API tokens, private file keys, or raw private design data.
  - type: input
    id: version
    attributes:
      label: CanvasProbe version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction with synthetic data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
