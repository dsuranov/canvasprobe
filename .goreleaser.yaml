version: 2

project_name: canvasprobe

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: canvasprobe
    main: .
    binary: canvasprobe
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/dsuranov/canvasprobe/cmd.version={{.Version}}

archives:
  - id: release
    ids:
      - canvasprobe
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - PRIVACY.md
      - SECURITY.md
      - THIRD_PARTY_NOTICES

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto

source:
  enabled: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"
